name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -o /dev/null ./cmd/remnanode-lite

      - name: shell contracts
        run: |
          bash -n scripts/*.sh deploy/remnawave-node-run.sh deploy/remnawave-node.openrc
          bash scripts/install-node-alpine.test.sh
          bash scripts/release-assets.test.sh

      - name: packaged Alpine gate
        run: bash scripts/test-alpine.sh
