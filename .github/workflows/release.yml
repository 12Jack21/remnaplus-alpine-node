name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          bash scripts/build-release-assets.sh \
            --tag "${GITHUB_REF_NAME}" \
            --output dist \
            --manifest candidate-manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/remnanode-lite_linux_amd64.tar.gz
            dist/remnanode-lite_linux_arm64.tar.gz
            dist/remnanode-native-installer_${{ github.ref_name }}.tar.gz
            dist/remnaplus-alpine-node-source-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS
