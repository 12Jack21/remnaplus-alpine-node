name: contract-sync

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Exact remnawave/node ref to audit; must match upstream.lock"
        required: false
        default: ""

jobs:
  compare-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve reviewed contract source
        id: source
        env:
          REQUESTED_REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          set -euo pipefail
          reviewed_commit="$(python3 -c 'import json; print(json.load(open("upstream.lock"))["officialContract"]["commit"])')"
          requested_ref="${REQUESTED_REF:-}"
          if [ -n "$requested_ref" ]; then
            case "$requested_ref" in
              -*|*[!A-Za-z0-9._/-]*)
                echo "::error::upstream_ref contains unsupported characters"
                exit 64
                ;;
            esac
          else
            requested_ref="$reviewed_commit"
          fi
          echo "ref=$requested_ref" >> "$GITHUB_OUTPUT"

      - name: Fetch exact upstream contract source
        env:
          UPSTREAM_REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          git init /tmp/remnawave-node
          git -C /tmp/remnawave-node remote add origin https://github.com/remnawave/node.git
          git -C /tmp/remnawave-node fetch --depth=1 origin "$UPSTREAM_REF"
          git -C /tmp/remnawave-node checkout --detach FETCH_HEAD

      - name: Verify source, version, and expanded routes
        run: python3 scripts/verify-contract-sync.py /tmp/remnawave-node

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test local contract and extensions
        run: go test ./internal/contract/...
